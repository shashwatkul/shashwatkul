name: Update GitHub Stats SVGs

# Generates the stats/top-langs cards as static SVG files and commits them
# to the repo, so the profile README no longer depends on the public
# vercel.app instance staying up at page-load time. If the source service
# happens to be down when this job runs, the last successfully generated
# SVG just stays in place instead of showing a broken image.

on:
  schedule:
    - cron: '0 3 * * *'   # once a day at 03:00 UTC — adjust as you like
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create output folder
        run: mkdir -p github-stats

      - name: Fetch main stats card
        run: |
          curl -sf "https://github-readme-stats.vercel.app/api?username=shashwatkul&show_icons=true&theme=dracula&hide_border=true&count_private=true" \
            -o github-stats/overview.svg || echo "Stats card fetch failed, keeping previous version"

      - name: Fetch top languages card
        run: |
          curl -sf "https://github-readme-stats.vercel.app/api/top-langs/?username=shashwatkul&layout=compact&theme=dracula&hide_border=true" \
            -o github-stats/languages.svg || echo "Languages card fetch failed, keeping previous version"

      - name: Fetch trophies card
        run: |
          curl -sf "https://github-profile-trophy.vercel.app/?username=shashwatkul&theme=dracula&no-frame=true&row=1&column=6" \
            -o github-stats/trophies.svg || echo "Trophies card fetch failed, keeping previous version"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-stats/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: refresh GitHub stats SVGs" && git push)
