name: Update GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"   # daily
  workflow_dispatch:        # manual "Run workflow" button
  push:
    branches: [main]
    paths:
      - ".github/workflows/github-stats.yml"

permissions:
  contents: write           # needed to commit the SVGs

jobs:
  update-stats:
    runs-on: ubuntu-latest
    env:
      USERNAME: shashwatkul
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare output folder
        run: mkdir -p github-stats

      - name: Fetch cards
        run: |
          fetch() {
            url="$1"; out="$2"
            if curl -fsSL --retry 3 --retry-delay 5 "$url" -o "$out.tmp" \
               && grep -q "<svg" "$out.tmp"; then
              mv "$out.tmp" "$out"
              echo "Updated $out"
            else
              rm -f "$out.tmp"
              echo "::warning::Could not update $out, keeping previous version"
            fi
          }

          fetch "https://github-readme-stats.vercel.app/api?username=${USERNAME}&show_icons=true&theme=dracula&hide_border=true&count_private=true&include_all_commits=true" \
                github-stats/overview.svg

          fetch "https://github-readme-stats.vercel.app/api/top-langs/?username=${USERNAME}&layout=compact&theme=dracula&hide_border=true&langs_count=8" \
                github-stats/languages.svg

          fetch "https://github-profile-trophy.vercel.app/?username=${USERNAME}&theme=darkhub&no-frame=true&no-bg=true&row=1&column=7" \
                github-stats/trophies.svg

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-stats/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update GitHub stats cards"
            git push
          fi
